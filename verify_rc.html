<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
        <title>
            Verify RC
        </title>
        <link rel = "stylesheet" href = "/Project-VerifyRC&License/styles/style.css">
        <script href = "scripts/script.js"></script>
    </head> 
    <body>
        <header>
            <h1>RC Verification Portal</h1>
        </header>

        <nav>
            <ul>
                <li><a href = "/Project-VerifyRC&License/home.html">Home</a></li>
                <li><a href = "/Project-VerifyRC&License/verify_rc.html">Verify RC</a></li>
                <li><a href = "/Project-VerifyRC&License/verify_license.html">Verify License</a></li>
                <li><a href = "/Project-VerifyRC&License/help.html">Help</a></li>
            </ul>
        </nav>

        <main>
            <section>
                <h2>Verify Registration Certificate (RC)</h2>

                <form>
                    <label>Vehicle Number</label>
                    <input type = "text" placeholder = "e.g., AP09AB1234" required>
                    <br>
                    <br> 
                    <button type = "submit">Verify RC</button>
                </form>
                <article id = "rc-details">
                    <h3>RC Details</h3>
                    <p>Owner Name: ________</p>
                    <p>Vehicle Model: ________</p>
                    <p>Registration Date: ________</p>
                    <p>Insurance Status: ________</p>
                </article>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Vehicle Verification System</p>
        </footer>
    </body>
</html>
