    <body>
        <header>
            <h1>Driving License Verification</h1>

        <nav>
            <ul>
                <li><a href = "index.html">Home</a></li>

        <main>
            <section>
                <h2>Verify Driving License</h2>
                <form>
                    <label>License Number</label>
                    <input type = "text" placeholder = "e.g., DL1420110012345" required>
                    <button type = "submit">Verify License</button>
                </form>

                <article id = "license-details">
                    <h3>License Details</h3>
                    <p>Holder Name: </p>
                    <p>License Type: </p>
                    <p>Issue Date: </p>
                    <p>Validity: </p>
                </article>
            </section>
        </main>
